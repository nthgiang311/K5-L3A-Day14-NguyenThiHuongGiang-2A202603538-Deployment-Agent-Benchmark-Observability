# Exercise 7.3 — Quality gate: chạy eval trên golden dataset, fail job (chặn merge) khi
# accuracy < 85% hoặc có regression so với baseline đã commit (reports/eval_v2_fixed.json).
# run_eval.py trả exit code 1 khi không đạt → step fail → PR không merge được
# (bật "Require status checks to pass" cho branch main trong Settings → Branches).
name: quality-gate

on:
  pull_request:
    paths:
      - "06-lab-complete/benchmark-observability/**"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start agent v2 (tắt lỗi ngẫu nhiên để eval ổn định)
        run: |
          AGENT_VERSION=v2 PORT=8000 MOCK_ERROR_RATE=0 MOCK_SLOW_RATE=0 python app.py &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done

      - name: Eval + quality gate
        run: |
          python eval/run_eval.py --url http://localhost:8000 \
            --min-accuracy 0.85 \
            --baseline ../../../reports/eval_v2_fixed.json \
            --out eval_ci.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: 06-lab-complete/benchmark-observability/develop/eval_ci.json
