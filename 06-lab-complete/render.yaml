# Render Blueprint — agent (Docker) + Redis (Key Value).
# Render đọc file này khi đặt ở gốc repo; nếu dùng Blueprint, copy ra gốc repo
# (rootDir đã trỏ vào 06-lab-complete).
services:
  - type: web
    name: production-ai-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis
          property: connectionString

  - type: keyvalue
    name: agent-redis
    plan: free
    region: singapore
    ipAllowList: []
