# Railway — deploy bằng Dockerfile trong thư mục này.
# Biến môi trường đặt trên dashboard / `railway variables`, KHÔNG ghi ở đây:
#   AGENT_API_KEY, REDIS_URL (= ${{Redis.REDIS_URL}}), RATE_LIMIT_PER_MINUTE, DAILY_BUDGET_USD, ENVIRONMENT
# PORT do Railway cấp — CMD trong Dockerfile đọc ${PORT:-8000}.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
